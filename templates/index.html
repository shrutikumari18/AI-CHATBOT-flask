<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ project_name }} - eagleAI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h2> {{ project_name }}</h2>
            <p>eagleAI - AI Assistant</p>
        </div>
        <div class="chat-messages" id="messages">
            <div class="message bot-message">
                <div class="message-bubble">
                    Hii, I am here to talk with you. Feel free to ask anything.😊
                </div>
            </div>
        </div>
        <div class="chat-input">
            <input type="text" class="input-field" id="messageInput" placeholder="Type your message..." autocomplete="off">
            <button class="send-btn" id="sendBtn" aria-label="Send message">➤</button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
